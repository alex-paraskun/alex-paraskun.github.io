# Настройки сайта Jekyll (GitHub Pages)
title: Параскун Александр Григорьевич
lang: ru

# ВАЖНО про baseurl:
#  • Пользовательский сайт (репозиторий  ИМЯ.github.io)      → baseurl: ""
#  • Проектный сайт     (репозиторий  любое-имя, адрес
#    ИМЯ.github.io/любое-имя)                                → baseurl: "/любое-имя"
baseurl: ""
url: ""

# Не включать в сайт служебные файлы
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Сайт кафедры (папка fss) временно скрыт: файлы остаются в репозитории, но на сайте не публикуются.
  # Чтобы снова открыть https://alex-paraskun.github.io/fss/ — удалите следующую строку.
  - fss
