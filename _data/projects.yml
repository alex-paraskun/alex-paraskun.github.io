- title:
    ru: Разрушение анодов импульсных рентгеновских трубок
    en: Anode destruction in pulsed X-ray tubes
  desc:
    ru: 'Экспериментальное и численное исследование разрушения анодов рентгеновских трубок с взрывной эмиссией электронов: усиление электрического поля, износ электродов, влияние формы поверхности анода (звездообразные канавки) на ресурс и параметры импульса.'
    en: 'Experimental and numerical study of anode destruction in X-ray tubes with explosive electron emission: electric-field intensification, electrode wear, and the effect of anode surface shape (starlike grooves) on lifetime and pulse parameters.'
  photos:
  - 31.jpeg

  files:
  - label: Effect of Starlike Grooves on Anode Surfaces (X-Ray Spectrometry, 2026)
    href: https://doi.org/10.1002/xrs.70125
  - label: Simulation of electric field intensification and anode wear (J. Appl. Phys., 2025)
    href: https://doi.org/10.1063/5.0276981
  - label: Анализ разрушений анодов… (ПМТФ, 2025)
    href: https://doi.org/10.15372/pmtf202515747
    
- title:
    ru: Численный волновой бассейн (метод SPH)
    en: Numerical wave tank (SPH method)
  desc:
    ru: Разработка и оптимизация численного волнового бассейна на основе метода сглаженных частиц (SPH), проектирование и изготовление флап-волнопродуктора, экспериментальная проверка генерации волн и сравнение с численным решением.
    en: Development and optimisation of a numerical wave tank based on smoothed-particle hydrodynamics (SPH), design and fabrication of a flap-type wave maker, and experimental validation of wave generation against the numerical solution.
  photos:
  - collage5.jpg
  - photo_2026-07-25_13-52-32.jpg

- title:
    ru: Кластеризация в волновой турбулентности
    en: Wave turbulence clusterisation
  desc:
    ru: Исследование механизмов формирования и дрейфа кластерных структур на поверхности и в толще жидкости при воздействии волновой турбулентности и других эффектов.
    en: Investigation of the mechanisms governing the formation and drift of cluster structures on the surface and within the bulk of a liquid under the influence of wave turbulence and other effects.
  photos:
  - collage4.jpg


- title:
    ru: Спиральные и векторно-инверсионные генераторы высоковольтных импульсов
    en: Spiral and vector-inversion high-voltage pulse generators
  desc:
    ru: 'Разработка и моделирование компактных генераторов высоковольтных импульсов для импульсных рентгеновских аппаратов: спиральные генераторы с разделёнными в пространстве индуктивной и ёмкостной частями, профилированные в виде меандра шины, распределение магнитного поля в векторно-инверсионных генераторах.'
    en: 'Development and modelling of compact high-voltage pulse generators for pulsed X-ray devices: spiral generators with spatially separated inductive and capacitive parts, meander-shaped busbars, and magnetic-field distribution in vector-inversion generators.'
  photos:
  - collage6.jpg
  files:
  - label: Spiral high-voltage pulse generator with spatially separated parts (JAMTP, 2024)
    href: https://doi.org/10.1134/S0021894424040023
  - label: Study of Magnetic Field Distribution in Vector-Inversion Generators (2025)
    href: https://doi.org/10.1134/S154747712570116X
  - label: Спиральный генератор… (ПМТФ, 2024)
    href: https://doi.org/10.15372/PMTF202315409
