# Материалы по преподавательской деятельности. Правьте здесь — GitHub Pages пересоберёт сайт сам.
#
# Как добавить материал к курсу:
#  1) положите файл в files/teaching/<код-курса>/  (например files/teaching/em/lecture-01.pdf)
#  2) допишите блок в список materials нужного курса:
#       - title: {ru: "Лекция 1. Электростатика", en: "Lecture 1. Electrostatics"}
#         href: files/teaching/em/lecture-01.pdf      # путь к файлу (без / в начале) или внешняя ссылка https://...
#         type: pdf                                    # pdf | slides | code | data | video | web | link
#         note: {ru: "2025-2026", en: "2025-2026"}     # необязательно
#
