# Материалы по преподавательской деятельности. Правьте здесь — GitHub Pages пересоберёт сайт сам.
#
# Как добавить материал к курсу:
#  1) положите файл в files/teaching/<код-курса>/  (например files/teaching/physics/lecture-01.pdf)
#  2) допишите блок в список materials нужного курса:
#       - title: {ru: "Лекция 1. Электростатика", en: "Lecture 1. Electrostatics"}
#         href: files/teaching/physics/lecture-01.pdf      # путь к файлу (без / в начале) или внешняя ссылка https://...
#         type: pdf                                    # pdf | slides | code | data | video | web | link
#         note: {ru: "2025-2026", en: "2025-2026"}     # необязательно
#
#  Если материалов много, их можно собрать в разворачивающиеся блоки: вместо materials укажите
#     groups:
#     - title: {ru: "Алгебра", en: "Algebra"}
#       materials: [ ...те же записи... ]
#
courses:
- id: physics
  title:
    ru: Физика, СУНЦ НГУ
    en: Physics, SESC NSU
  materials:
  - title:
      ru: Обработка и анализ результатов физических измерений
      en: Processing and analysis of physical measurement results
    href: files/teaching/physics/measurement-analysis.pdf
    type: pdf
    note:
      ru: Учебно-методическое пособие, СУНЦ НГУ, 2026 (36 с.)
      en: Textbook, SESC NSU, 2026 (36 pp.)
  - title:
      ru: Основные законы магнетизма. Электромагнитная индукция
      en: Basic laws of magnetism. Electromagnetic induction
    href: files/teaching/physics/magnetism-induction.pdf
    type: pdf
    note:
      ru: Учебно-методическое пособие, СУНЦ НГУ, 2026 (34 с.). Параскун А. Г., Котельникова М. С., Чигарев М. П.
      en: Textbook, SESC NSU, 2026 (34 pp.). Paraskun A. G., Kotelnikova M. S., Chigarev M. P.
  - title:
      ru: Электростатика на компьютере
      en: Electrostatics on the computer
    href: electrostatics.html
    type: web
    note:
      ru: Модели из учебного пособия «Численные методы решения задач электростатики», с кодом на Python
      en: Models from the textbook "Numerical methods for electrostatics problems", with Python code
  groups:
  - title:
      ru: Проектная деятельность
      en: Research projects
    materials:
    - title:
        ru: Основы проектной деятельности в физике
        en: Fundamentals of research projects in physics
      href: files/teaching/physics/project-basics.pdf
      type: pdf
      note:
        ru: "Семинар: структура проектной деятельности, мини-исследование «Период качания маятника»"
        en: "Seminar: structure of a research project, mini-study \"Period of a pendulum\""

