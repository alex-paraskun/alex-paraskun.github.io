h:
  ru: Научное направление
  en: Research focus
text:
  ru: 'Исследования посвящены нескольким параллельным направлениям. **Высоковольтная импульсная электрофизика**: численное моделирование и эксперимент по разрушению анодов рентгеновских трубок с взрывной эмиссией электронов, усиление электрического поля и износ электродов, математические методы решения обратных задач восстановления спектра рентгеновских излучателей. **Численное моделирование волновых процессов методом сглаженных частиц (SPH)** и его экспериментальная проверка в волновом бассейне. Исследование задач **сегрегации и кластеризации** частиц на нелинейных волнах и в волновой турбулентности. '
  en: 'The research covers several parallel areas. **High-voltage pulsed electrophysics**: numerical modeling and experimental studies regarding the destruction of explosive-electron-emission X-ray tube anodes, electric field enhancement and electrode wear, and mathematical methods for solving inverse problems to reconstruct X-ray source spectra. **Numerical modeling of wave processes using the Smoothed Particle Hydrodynamics (SPH) method** and its experimental validation in a wave tank. Investigation of **particle segregation and clustering** phenomena associated with nonlinear waves and wave turbulence.'
