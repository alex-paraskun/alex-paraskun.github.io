  abs:
    text:
      ru: В данной работе, обусловленной необходимостью исследования процессов разрушения электродов для увеличения срока службы рентгеновских трубок, представлены экспериментальные данные о деградации поверхности анодов в импульсных вакуумных рентгеновских трубках. Были проведены измерения дозы излучения для трубок с различной степенью износа; путем решения обратной задачи были реконструированы спектры рентгеновского излучения этих трубок. Приведены результаты исследования поверхности анодов, полученные с помощью сканирующего электронного микроскопа. Оценено влияние данного вида разрушения на основные рабочие характеристики рентгеновской трубки. Предложено возможное описание механизма, лежащего в основе этого явления.)
      en: Driven by the necessity to investigate electrode destruction in order to increase the service life of X-ray tubes, this work presents experimental findings on the surface degradation of anodes in pulsed vacuum X-ray tubes. Radiation dose measurements were performed for tubes with varying degrees of wear; by solving the inverse problem, the X-ray emission spectra for these tubes were reconstructed. The results of the anode surface examination, obtained using a scanning electron microscope, are presented. The influence of this type of destruction on the characteristic operating parameters of the X-ray tube was assessed. A possible description of the underlying mechanism of this effect is proposed.)
